<!-- FILE: index.html (Vite + React entry) -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a1420" />
    <meta name="description" content="SnapFaultCore — Professional Automotive Diagnostic Platform by SnapCore AI Systems Ltd." />

    <title>SnapFaultCore</title>

    <!-- PWA (safe to keep even if you don't use a SW yet) -->
    <!-- Use whichever manifest path you actually have; both are harmless -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="manifest" href="/public/manifest.json" />

    <!-- Icons (adjust paths to your actual files if different) -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/snapfaultcore-192.png" />
    <link rel="apple-touch-icon" href="/icons/snapfaultcore-192.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#ff4444" />

    <!-- Basic preconnects (optional perf) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /* Tiny, safe baseline so the initial loader isn't ugly */
      :root {
        --bg: #06080f;
        --fg: #e5f4ff;
        --accent: #00d4ff;
      }
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, Arial, "Helvetica Neue", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
      }
      /* Minimal loader while React boots */
      .boot {
        display: grid;
        place-items: center;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }
      .ring {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 2px solid rgba(0,212,255,0.25);
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
      }
      .ring::after {
        content: "";
        position: absolute;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(124,58,237,0.25);
        border-right-color: #7c3aed;
        animation: spinReverse 1.5s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinReverse { to { transform: rotate(-360deg); } }

      .boot-text {
        margin-top: 16px;
        font-size: 14px;
        color: #a8b3c7;
        text-align: center;
      }

      /* Hide loader once React has taken over (React often wipes innerHTML) */
      .boot[data-mounted="true"] { display: none; }

      /* Noscript banner */
      noscript .noscript-msg {
        position: fixed;
        inset: auto 0 0 0;
        background: #3b0c0c;
        color: #fff;
        padding: 10px 14px;
        text-align: center;
        z-index: 9999;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- Minimal loader shown before React mounts -->
    <div id="boot" class="boot" aria-hidden="true">
      <div class="ring"></div>
      <div class="boot-text">SnapFaultCore is initializing…</div>
    </div>

    <!-- React mounts here -->
    <div id="root"></div>

    <noscript>
      <div class="noscript-msg">
        JavaScript is disabled. SnapFaultCore requires JavaScript to run.
      </div>
    </noscript>

    <!-- Mark loader as hidden once React attaches -->
    <script>
      // Vite attaches the module after this tag; when React mounts it typically clears #root innerHTML.
      // We also set a tiny timer to hide the boot screen anyway.
      (function () {
        var boot = document.getElementById('boot');
        var hide = function(){ boot && boot.setAttribute('data-mounted', 'true'); };
        window.addEventListener('DOMContentLoaded', function(){ setTimeout(hide, 500); });
        window.addEventListener('load', function(){ setTimeout(hide, 300); });
      })();
    </script>

    <!-- Vite + React entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
